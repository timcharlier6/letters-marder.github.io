<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, orientation=landscape"
        />
        <title>Respirer avec les Plantes</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                font-family: "Roboto", sans-serif;
            }

            body {
                background-image: url("./img/400x711.gif");
                min-width: 100vw;
                min-height: 100vh;
                background-repeat: no-repeat;
                background-size: cover;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            main {
                width: min(520px, 80vw);
            }

            #p {
                line-height: 1.7;
                color: #333;
                font-weight: bold;
                font-size: 1.4rem;
                background-color: transparent;
                text-shadow:
                    1px 1px 6px white,
                    0 0 20px white;
                transition: opacity 0.7s ease;
                word-break: normal;
                overflow-wrap: break-word;
                hyphens: auto;
            }

            /* blinking cursor */
            #cursor {
                display: inline-block;
                width: 2px;
                height: 0.85em;
                background: #333;
                vertical-align: text-bottom;
                margin-left: 2px;
                animation: blink 1s step-end infinite;
            }

            /* progress dots */
            #progress {
                position: fixed;
                bottom: 1.5rem;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 7px;
            }

            .dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: rgba(51, 51, 51, 0.2);
                box-shadow: 1px 1px 3px white;
                transition: background 0.4s ease;
            }

            .dot.active {
                background: rgba(51, 51, 51, 0.65);
            }

            @keyframes blink {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p id="p" lang="fr"><span id="cursor"></span></p>
        </main>

        <div id="progress"></div>

        <script>
            const sentences = [
                "Cela, aussi, est un mode de mouvement de la plante\u00a0: voyager sur les flux d'air ou sur les ailes d'une abeille.",
                "Cherchant un refuge, nous fuyons les éléments, alors que les plantes s'exposent à l'air, à la terre et à l'humidité.",
                "Comme les feuilles des plantes, notre peau détecte l'humidité et la température, les gradients de lumière et les vibrations.",
                "Dans les bois, l'éclat du soleil est plus doux, plus subtil, plus ludique, avec des mosaïques complexes d'ombre et de lumière.",
                "Dans un environnement où les ressources sont limitées, la décision de la plante sur le site de sa nouvelle croissance ne laisse pas beaucoup de marge d'erreur.",
                "J'ai eu l'impression que tout se passait plus lentement et que la vie devenait plus vivante, le temps était gagné pour la vie.",
                "L'enracinement des plantes dans le sol détermine leur attention aux lieux qu'elles habitent et ne peuvent pas abandonner.",
                "La reproduction des mêmes structures végétales telles que les branches et les feuilles, garantit que la plante ait un certain nombre d'antennes vertes qui surveillent constamment l'environnement.",
                "Libérant du pollen, à la merci du vent ou des insectes, elles se jettent dehors sans aucune garantie de succès.",
                "Lorsque je m'attarde avec les plantes, je me retrouve en communion avec tout ce qu'elles sont et vivent, et je deviens moi-même autrement.",
                "Nous pouvons illustrer esthétiquement l'héritage végétal en nous, le sens fugace de notre propre végétation.",
                "Nous, ainsi que tout ce qui vit, recevons toujours beaucoup plus des plantes que nous ne leur rendons, car les plantes respirent pour tous les animaux et les êtres humains sans exception.",
                "Tout se ralentit au rythme de leur croissance\u2026",
            ];

            const CHAR_DELAY = 90;
            const PAUSE_AFTER = 2800;
            const FADE_TIME = 700;

            const pEl = document.getElementById("p");
            const cursor = document.getElementById("cursor");
            const progressEl = document.getElementById("progress");

            sentences.forEach((_, i) => {
                const dot = document.createElement("div");
                dot.className = "dot";
                dot.id = "dot-" + i;
                progressEl.appendChild(dot);
            });

            let sentenceIndex = 0;

            function setActiveDot(i) {
                document.querySelectorAll(".dot").forEach((d, idx) => {
                    d.classList.toggle("active", idx === i);
                });
            }

            function clearText(callback) {
                pEl.style.opacity = "0";
                setTimeout(() => {
                    while (pEl.firstChild) pEl.removeChild(pEl.firstChild);
                    pEl.appendChild(cursor);
                    pEl.style.opacity = "1";
                    setTimeout(callback, 80);
                }, FADE_TIME);
            }

            function typeSentence() {
                const sentence = sentences[sentenceIndex];
                setActiveDot(sentenceIndex);

                const textNode = document.createTextNode("");
                pEl.insertBefore(textNode, cursor);
                let charIndex = 0;

                function typeChar() {
                    if (charIndex < sentence.length) {
                        textNode.nodeValue += sentence[charIndex++];
                        setTimeout(typeChar, CHAR_DELAY);
                    } else {
                        setTimeout(() => {
                            clearText(() => {
                                sentenceIndex =
                                    (sentenceIndex + 1) % sentences.length;
                                typeSentence();
                            });
                        }, PAUSE_AFTER);
                    }
                }

                typeChar();
            }

            setTimeout(typeSentence, 200);
        </script>
    </body>
</html>
