<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typewriter</title>
<style>
  :root { color-scheme: light; --pad: clamp(20px, 5vmin, 56px); }
  html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden; }

  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
  @media (orientation: landscape) { #stage { flex-direction: row; } }

  .pane { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; }

  /* hairline divider; drawn on a pseudo-element so both panes keep identical content boxes */
  #b::before { content: ""; position: absolute; background: #000; z-index: 3; left: 0; top: 0; right: 0; height: 1px; }
  @media (orientation: landscape) {
    #b::before { right: auto; bottom: 0; width: 1px; height: auto; }
  }

  .txt {
    position: absolute; inset: var(--pad);
    overflow: hidden; background: #fff;
    font: clamp(30px, 2.4vmin, 22px) / 1.7 "Courier New", Courier, monospace;
    line-height: 60px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  #a .txt { z-index: 1; }
  #b .txt { z-index: 2; }
  .txt.measure { visibility: hidden; }

  .rest { color: transparent; }
  .caret {
    position: absolute; left: 0; top: 0; width: .55ch; height: 1.15em;
    background: #000; pointer-events: none;
    animation: blink 1s steps(1) infinite;
  }
  .caret[hidden] { display: none; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div class="pane" id="a"><div class="txt"></div></div>
  <div class="pane" id="b"><div class="txt"></div></div>
</div>

<script>
/* ---------- settings ---------- */
const FILE = 'french.txt';                       // <- link your text file here
const SPEEDS = [2, 5, 10, 15, 22, 30, 45, 70, 110, 200, 400, 800]; // characters per second
let level = 2;                                 // default speed index
const SLIDE_MS = 900;

/* ---------- setup ---------- */
const mk = id => {
  const el = document.getElementById(id), txt = el.querySelector('.txt');
  const node = document.createTextNode('');           // typed text (visible)
  const restEl = document.createElement('span');      // not yet typed (invisible, but laid out)
  restEl.className = 'rest';
  const rest = document.createTextNode('');
  restEl.append(rest);
  const caret = document.createElement('span');
  caret.className = 'caret'; caret.hidden = true;
  txt.append(node, restEl, caret);
  return { el, txt, node, rest, caret };
};

/* caret is positioned over the next character, outside the text flow */
const rg = document.createRange();
function place(p) {
  const tr = p.txt.getBoundingClientRect();
  let x = tr.left, y = tr.top, r = null;
  if (p.rest.data.length) {
    rg.setStart(p.rest, 0); rg.setEnd(p.rest, 1);
    r = rg.getClientRects()[0];
    if (r) { x = r.left; y = r.top; }
  } else if (p.node.data.length) {
    const n = p.node.data.length;
    rg.setStart(p.node, n - 1); rg.setEnd(p.node, n);
    const rs = rg.getClientRects(); r = rs[rs.length - 1];
    if (r) { x = r.right; y = r.top; }
  }
  p.caret.style.transform = `translate(${x - tr.left}px,${y - tr.top}px)`;
}
const A = mk('a'), B = mk('b');
const M = document.createElement('div');       // hidden measuring element
M.className = 'txt measure';
A.el.appendChild(M);

let text = '', gen = 0, aStart = 0;

/* ---------- pagination ---------- */
const WS = /\s/;
function fits(s, n) {
  M.textContent = text.slice(s, s + n);
  return M.scrollHeight <= M.clientHeight + 1;
}
function take(from) {
  let s = from;
  if (from > 0) while (s < text.length && WS.test(text[s])) s++;
  const rem = text.length - s;
  if (rem <= 0) return { s, e: text.length, t: '' };
  const cap = Math.min(rem, 6000);
  if (rem <= 6000 && fits(s, rem)) return { s, e: text.length, t: text.slice(s).replace(/\s+$/, '') };
  let lo = 1, hi = cap;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fits(s, mid)) lo = mid; else hi = mid - 1; }
  let e = s + lo;
  if (e < text.length && !WS.test(text[e]) && !WS.test(text[e - 1])) {
    let k = e; while (k > s && !WS.test(text[k - 1])) k--;
    if (k > s) e = k;                          // don't split a word across screens
  }
  return { s, e, t: text.slice(s, e).replace(/\s+$/, '') };
}

/* ---------- typing ---------- */
function type(p, str, my) {
  return new Promise(res => {
    let i = 0; p.node.data = ''; p.rest.data = str; p.caret.hidden = false; place(p);
    (function step() {
      if (my !== gen) return res();
      if (i >= str.length) { p.caret.hidden = true; return res(); }
      const cps = SPEEDS[level];
      let n = 1, w = 1000 / cps;
      if (cps > 60) { n = Math.round(cps * 0.016); w = 16; }
      p.node.data += str.slice(i, i + n); i += n;
      p.rest.data = str.slice(i); place(p);
      if (n === 1) {
        const c = str[i - 1];
        w *= 0.7 + Math.random() * 0.6;        // slight human irregularity
        if (c === '\n') w *= 2.5;
        else if ('.!?'.includes(c)) w *= 3;
        else if (',;:'.includes(c)) w *= 1.8;
      }
      setTimeout(step, w);
    })();
  });
}

/* ---------- slide screen 2 -> screen 1 ---------- */
async function slide() {
  const ar = A.el.getBoundingClientRect(), br = B.el.getBoundingClientRect();
  const dx = ar.left - br.left, dy = ar.top - br.top;
  const mv = B.txt.animate(
    [{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px,${dy}px)` }],
    { duration: SLIDE_MS, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
  A.txt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: SLIDE_MS, easing: 'ease', fill: 'forwards' });
  try { await mv.finished; } catch (e) {}
  A.txt.getAnimations().forEach(a => a.cancel());
  B.txt.getAnimations().forEach(a => a.cancel());
  A.node.data = B.node.data; A.rest.data = '';
  B.node.data = ''; B.rest.data = '';
}

/* ---------- main loop ---------- */
async function play(from, instant) {
  const my = ++gen;
  [A, B].forEach(p => { p.txt.getAnimations().forEach(a => a.cancel()); p.caret.hidden = true; });
  A.node.data = B.node.data = A.rest.data = B.rest.data = '';
  let page = take(from);
  aStart = page.s;
  let pos = page.e;
  if (instant) A.node.data = page.t; else await type(A, page.t, my);

  while (my === gen && pos < text.length) {
    const nx = take(pos);
    if (!nx.t) break;
    await type(B, nx.t, my);
    if (my !== gen) return;
    pos = nx.e;
    if (pos >= text.length) break;             // last screen finished
    await slide();
    if (my !== gen) return;
    aStart = nx.s;
  }
}

/* ---------- events ---------- */
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') level = Math.min(SPEEDS.length - 1, level + 1);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') level = Math.max(0, level - 1);
  else return;
  e.preventDefault();
});

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (text) play(aStart, true); }, 250);
});

/* ---------- start ---------- */
fetch(FILE)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    if (/^\s*<(!doctype|html)/i.test(t) && !/\.html?$/i.test(FILE)) throw new Error('html');
    text = t.replace(/\r\n?/g, '\n'); play(0, false);
  })
  .catch(() => {
    A.node.data = 'Could not load "' + FILE + '".\nThe server returned a page instead of the text file, or the file could not be read. Check the path (open it directly in the browser), or serve over http rather than file://.';
  });
</script>
</body>
</html>
